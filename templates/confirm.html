{% extends "layout.html" %}
{% block title %}Vahvista{% endblock %}
{% block content %}
<div class="form">
  <form action="{{ page }}" method="post">
    <p>
      Haluatko varmasti {{ msg }}?
    </p>
    <button name="no">Ei</button>
    <button name="yes">Kyllä</button>
    <input type="hidden" name="next_page" value="{{ next_page }}" />
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  </form>
</div>
{% endblock %}
